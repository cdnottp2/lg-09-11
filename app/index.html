<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <title>Master IPTV</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <div id="detail" class="hidden"></div>
  <div id="profiles" class="hidden scroll"></div>

  <div id="player" class="hidden">
    <video id="video" autoplay></video>
    <div id="buffer" class="hidden"><div class="spinner"></div></div>
    <div id="chnum" class="hidden"></div>
    <div id="osd" class="hidden">
      <div class="osd-top"><span></span><span id="osd-clock"></span></div>
      <div class="osd-bottom">
        <div id="osd-logo"></div>
        <div class="osd-info">
          <div class="osd-titlerow"><div id="osd-title"></div><span id="osd-res" class="hidden"></span></div>
          <div id="osd-sub"></div>
          <div id="osd-sub2"></div>
          <div id="osd-menu"><button id="osd-prevep" class="omb hidden" type="button"><span></span></button><button id="osd-tracks" class="omb" type="button">Áudio e legenda</button><button id="osd-guide" class="omb hidden" type="button">Guia de TV</button><button id="osd-nextep" class="omb hidden" type="button"><span></span></button></div>
          <div id="osd-bar" class="hidden">
            <span id="osd-cur">0:00</span>
            <div class="track"><div id="osd-fill"></div></div>
            <span id="osd-dur">0:00</span>
          </div>
        </div>
        <div id="osd-hint"></div>
      </div>
    </div>
    <div id="tracks" class="hidden scroll"></div>
    <div id="pguide" class="hidden scroll guide pguide"></div>
  </div>

  <div id="splash" class="hidden"><div class="bootlogo"><svg class="bootmark" viewBox="0 0 100 100" width="120" height="120"><defs><linearGradient id="spg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ab4e0"/><stop offset="1" stop-color="#2f62d8"/></linearGradient></defs><rect x="4" y="4" width="92" height="92" rx="24" fill="url(#spg)"/><path d="M38 28 L74 50 L38 72 Z" fill="#fff"/></svg><div class="bootname"><span class="boot1">MASTER</span> <span class="boot2">IPTV</span></div></div><div class="bootbar"><i></i></div><div id="splash-text">Conectando…</div></div>
  <div id="loader" class="hidden"><div class="spinner"></div><div id="loader-text">Carregando…</div></div>
  <div id="toast" class="hidden"></div>
  <div id="goal" class="hidden"></div>

  <script src="lib/hls.min.js"></script>
  <script src="lib/mpegts.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/sports.js"></script>
  <script src="js/avatars.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/android.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
